[project]
name = "communitylab"
version = "0.1.0"
description = "Motor Inteligente de Transformación y Distribución para Comunidades Digitales — Hackathon ONE G10"
requires-python = "==3.11.*"
dependencies = [
    # Backend / API
    "fastapi>=0.140,<0.141",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0,<2.0",

    # Agente / orquestación
    "pydantic-ai>=2.33,<3.0",
    "langgraph>=1.2,<1.3",

    # Interfaz de curaduría
    "streamlit>=1.63,<1.64",

    # Oracle Cloud Infrastructure (Object Storage)
    "oci>=2.185,<3.0",

    # Logging estructurado (JSON) y trazabilidad contextual
    "structlog>=26.1,<27",
]

[tool.uv]
# exclude-newer con duración relativa ("7 days") requiere un uv reciente; con
# versiones antiguas falla con un error de configuración poco claro.
required-version = ">=0.11"
# Proyecto de aplicación (monorepo plano): uv instala solo las dependencias y
# no intenta construir/instalar el propio proyecto como paquete.
package = false
# Defensa ante ataques a la cadena de suministro: al resolver (`uv lock` /
# `uv add`), se ignoran versiones publicadas hace menos de 7 días, dando
# margen a que PyPI detecte y retire releases comprometidos. No afecta a las
# versiones ya fijadas en uv.lock. Si hace falta un parche urgente de un
# paquete concreto, exceptuarlo temporalmente (y retirar la excepción luego):
# exclude-newer-package = { nombre-del-paquete = false }
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15,<1.0",
    "scikit-learn>=1.9,<2.0",
    "scipy>=1.17,<1.18",
    # Solo desarrollo: kernel para notebooks / celdas interactivas (p. ej. en
    # VS Code) con el mismo entorno del proyecto. No va en `dependencies`
    # para que no llegue al despliegue de FastAPI/Streamlit.
    "ipykernel>=6.29",
]

[tool.ruff.lint.per-file-ignores]
# storage/oci_client.py atrapa Exception de forma amplia a propósito en sus
# fronteras con el SDK de OCI (red, serialización): es resiliencia operativa
# deliberada (degradar sin tumbar el lote), no manejo de errores descuidado.
"storage/oci_client.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite `import storage...`, `import esquemas` desde la raíz
addopts = "-ra -m 'not integration'"
markers = [
    "integration: pruebas contra OCI real (requieren credenciales; usar -m integration)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
